# Step two: a real repository, still writing nothing.
#
# Everything here is live except the writing. The mappings are read, the
# capabilities are evaluated, and the findings say what WOULD have happened —
# which is how a maintainer sees the blast radius before accepting it.
#
# The label strings are this repository's own words. A capability never sees
# them; it asks for `awaitingTriage` and the adapter looks up the string.

mode: observe

capabilities:
  triageQueue:
    enabled: true
    welcome: false

mappings:
  labels: # every other meaning keeps its default spelling; this one is spelled the repository's way
    ready: "status: ready for dev"

principals:
  maintainerTeam: hiero-sdk-js-maintainers
