# Everything the App reads today, in one file: every shipped capability on,
# every mapping family filled, a principal, and inactivity's clocks overridden
# at each of the three levels they can be. Not a recommendation — a catalogue
# of the options, each with the sentence that says what it is for. Copy the
# parts you want. Every setting at its DEFAULT, with its sentence, is the
# generated tree on docs/capabilities.md; this file is where the overrides
# are shown. The test suite holds it to that claim: a capability the App
# gains and this file does not is a failing check.
#
# `dry-run` is the rehearsal: the report names each change the App would make,
# and nothing is written.

mode: dry-run

capabilities:
  triageQueue: # a new issue is labelled awaitingTriage
    enabled: true
    welcome: true # and told so in a comment (default: false)

  prDashboard: # one comment per pull request, kept current: what stops it being reviewable
    enabled: true
    checks: # every check the App runs today, switched on — each one is off until it is
      dcoSignoff: # a commit carries no Signed-off-by trailer
        enabled: true
        guide: "https://github.com/<org>/<repo>/wiki/Signing-Guide" # optional — shown to the contributor on failure
      gpgSignature: # a commit has no verified signature
        enabled: true
        guide: "https://github.com/<org>/<repo>/wiki/Signing-Guide"
      mergeConflicts: # the branch does not merge cleanly
        enabled: true
      linkedIssues: # the pull request references no issue
        enabled: true
        guide: "https://github.com/<org>/<repo>/wiki/Linking-Issues"
        assignedIssues: # the author is not assigned to every linked issue — nested, because it depends on the link
          enabled: true
          guide: "https://github.com/<org>/<repo>/wiki/Assignment"
    applyLabels: [needsRevision, needsReview] # the positions the verdict may set — each one mapped below

  configReport: # a pull request that changes this file gets one comment saying what it would mean
    enabled: true # reads no settings today

  inactivity: # on the hourly schedule: remind about stalled work, then release it
    enabled: true
    exemptBlocked: true # default: true — an item carrying `blocked` is never reminded or reaped
    remindAfter: 14d # default: 14d — the capability-wide reminder …
    reap: # … and the capability-wide release clock, which every level inherits
      after: 21d # default: 21d — consent to act belongs to each level that acts
    issues: # assigned issues with no open pull request
      enabled: true
      remindAfter: 21d # ladder override
      reap: # omit this block and the ladder reminds and never releases
        enabled: true
        after: 30d # reap = release the assignment
    pullRequests: # any pull request, linked or not
      enabled: true
      reap: # a section, not a block: the ladder passes the clock down and acts on nothing itself
        after: 60d # ladder override; remindAfter inherits 14d. reap = close
      reapWhen: # the ladder applies only to pull requests in one of these states
        draft: # GitHub's draft state — no mapping needed
          enabled: true
          reap:
            enabled: true # inherits the ladder's 60d
        changesRequested: # GitHub's review state — no mapping needed
          enabled: true
          reap:
            enabled: true
        needsRevision: # your needsRevision label, mapped below
          enabled: true
          remindAfter: 2d # reason override — a quality failure moves fast
          reap:
            enabled: true
            after: 5d

  assignment: # a contributor claims an issue with a comment, and releases it the same way
    enabled: true
    autoAssign: # the assign command, mapped below
      enabled: true
      claimableOnlyWhen: [ready] # default: [] — any open issue is claimable
      notClaimableWhen: [blocked, awaitingTriage] # default: [] — deny wins over claimableOnlyWhen
      capIgnores: [blocked] # default: [] — an assignment carrying one of these does not count
      maxOpen: 3 # default: 2 — open assignments a person may hold; 0 = uncapped
    unassign: # the unassign command, mapped below — releases only the commenter's own assignment
      enabled: true

mappings:
  labels: # every meaning has a default spelling; map one only to spell it your own way
    awaitingTriage: "status: triage"
    ready: "status: ready for dev"
    inProgress: "status: in progress"
    needsReview: "status: needs review"
    needsRevision: "status: needs revision"
    readyToMerge: "status: ready to merge"
    blocked: "status: blocked" # human authority — the App reads it and never sets it
  commands: # the words contributors type in a comment
    assign: "/assign"
    unassign: "/unassign"
    working: "/working" # "still on it" — resets inactivity's clock
  skills: # the difficulty ladder, as labels
    goodFirstIssue: "good first issue"
    beginner: "skill: beginner"
    intermediate: "skill: intermediate"
    advanced: "skill: advanced"
  alerts: # names are yours; each is carried by a label
    p0: "P0-🔥"
    security: "Security"

principals: # roles a capability may address, one name each
  maintainerTeam: hiero-sdk-js-maintainers
