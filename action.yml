name: sdk-automations
description: Runs the sdk-automations engine on one GitHub event, or on the hourly sweep, for the repository that uses it.
author: hiero-hackers
branding:
  icon: check-square
  color: blue
inputs:
  token:
    description: The token the run reads and writes GitHub with.
    default: ${{ github.token }}
  arm-writes:
    description: The second gate on writes, beside the config's mode; "true" lets a live config act.
    default: "false"
  bot-login:
    description: The login the token writes as, ending in [bot]; set it with app-id when token is another App's installation token.
    default: github-actions[bot]
  app-id:
    description: The App id behind the token, so a run recognises its own comments.
    default: "15368"
  sweep-cursor:
    description: A file where the sweep keeps its place between scheduled runs, carried by the workflow's cache; empty starts every sweep at the first item.
    default: ""
runs:
  using: node24
  main: packages/runtime/dist/action.js
