name: action-conformance

# The Action's sandbox protocols: `pnpm lab:action` provokes real events in the
# personal sandbox, reads the runs they raised and judges them against the
# journeys table. Nightly, and on demand for a named commit before it is
# tagged (D234). A red run is the alert.
#
# `schedule` and `workflow_dispatch` only, never any pull request form: fork
# code must not run in a job that holds the sandbox App's key. The job's own
# token is read-only; every write is the sandbox App's, in the sandbox alone,
# and the run disarms the sandbox again on every exit.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      engine:
        description: The full commit SHA the sandbox runs; empty is this workflow's own commit.
        default: ""
      protocols:
        description: Protocol ids, comma-separated (9.1,9.2,9.4,9.6); empty is the pre-tag batch.
        default: ""
      arm:
        description: Arm the sandbox so the writing protocols run; it is disarmed again on exit.
        type: boolean
        default: true

permissions:
  contents: read

# One run at a time: two would drive the same sandbox and read each other's runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  conformance:
    name: sandbox conformance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner takes a PATH to the App's key and never a key value, as
      # conformance.yml does. Without the secret the protocols are skipped, so
      # a fork without the sandbox is green and silent rather than red.
      - name: place the sandbox app key
        env:
          SANDBOX_APP_PRIVATE_KEY: ${{ secrets.SANDBOX_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${SANDBOX_APP_PRIVATE_KEY}" ]; then
            echo "::notice::no sandbox app key secret: the protocols are skipped"
            exit 0
          fi
          KEY_PATH="${RUNNER_TEMP}/sandbox-app.pem"
          install -m 600 /dev/null "${KEY_PATH}"
          printf '%s' "${SANDBOX_APP_PRIVATE_KEY}" > "${KEY_PATH}"
          echo "PRIVATE_KEY_PATH=${KEY_PATH}" >> "${GITHUB_ENV}"
      # The scheduled run arms the sandbox; a dispatched one arms it unless told
      # not to. A person's token, when the optional secret holds one, lets the
      # protocols that need a human actor (9.6, and 9.2's reversal) run too;
      # without it they are listed as skipped. `--long` never runs here.
      - name: run the protocols
        if: env.PRIVATE_KEY_PATH != ''
        working-directory: packages/dev/lab
        env:
          APP_ID: ${{ secrets.SANDBOX_APP_ID }}
          INSTALLATION_ID: ${{ secrets.SANDBOX_INSTALLATION_ID }}
          SANDBOX_REPO: ${{ secrets.SANDBOX_REPO }}
          GITHUB_TOKEN: ${{ secrets.SANDBOX_PERSON_TOKEN }}
          ENGINE_COMMIT: ${{ inputs.engine || github.sha }}
          PROTOCOLS: ${{ inputs.protocols }}
          ARM: ${{ (github.event_name == 'schedule' || inputs.arm) && '--arm' || '' }}
        run: pnpm lab:action ${PROTOCOLS:+--only "${PROTOCOLS}"} ${ARM:+"${ARM}"}
      # The backstop for a run the runner killed before its own restore ran:
      # the variable back to false and the config to dry-run, whatever else is left.
      - name: disarm the sandbox
        if: always() && env.PRIVATE_KEY_PATH != ''
        working-directory: packages/dev/lab
        env:
          APP_ID: ${{ secrets.SANDBOX_APP_ID }}
          INSTALLATION_ID: ${{ secrets.SANDBOX_INSTALLATION_ID }}
          SANDBOX_REPO: ${{ secrets.SANDBOX_REPO }}
          GITHUB_TOKEN: ${{ secrets.SANDBOX_PERSON_TOKEN }}
        run: pnpm lab:action --disarm
      # The verdicts alone cross out of the runner: the evidence directories
      # hold whole payloads and run logs, which stay private (lab README).
      - name: keep the verdicts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verdicts
          path: packages/dev/lab/evidence/**/verdict.txt
          if-no-files-found: ignore
          retention-days: 30
