name: ci

# `pull_request`, deliberately NOT `pull_request_target`: fork code runs with
# no secrets and a read-only token. The mutation job below executes Stryker
# against configuration a fork can edit, so the workflow must never hand that
# code anything it could exfiltrate.
#
# The weekly and manual runs separate "the world changed" from "your change
# broke it": dependency advisories and environment rot otherwise wait for
# someone to push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

# Goal 4 applied to ourselves: the smallest practical permission set. Nothing
# here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: typecheck and tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the LTS floor we support; 25 is what development happens on.
        # The matrix is not ceremony: `store/` uses `node:sqlite`, which is
        # still experimental and still emits a warning on 24 — an API that
        # can change between majors is one worth testing on both.
        node: [24, 25]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each package's own `test` script is `tsc --noEmit && vitest run`, so
      # this covers typechecking too.
      - run: pnpm -r test

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate

  mutation:
    name: mutation testing (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails the build below `thresholds.break` in core/stryker.config.json.
      # That number is load-bearing: a module can leave the mutate glob, or
      # lose its tests to another package, without a single test failing —
      # both have happened, and only the score showed it.
      - run: pnpm --filter @hiero-hackers/automation-core exec stryker run

  scheduled-failure-report:
    name: report scheduled failure
    # `needs` keeps this from racing the three jobs above; `failure()` only
    # sees a meaningful result after they finish.
    needs: [test, audit, mutation]
    if: github.event_name == 'schedule' && failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update an issue naming the failed job
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failed_jobs="$(
            gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --json jobs \
              --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")' 2>/dev/null \
              || echo "unknown"
          )"
          title="Scheduled CI failed"
          body="Scheduled CI run $GITHUB_RUN_ID failed in: ${failed_jobs:-unknown}."
          existing="$(
            gh issue list --repo "$GITHUB_REPOSITORY" --state open \
              --search '"Scheduled CI failed"' \
              --json number --jq '.[0].number // empty'
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
