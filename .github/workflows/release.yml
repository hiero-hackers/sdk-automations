# On a version tag: the hosted image, pushed and attested; and the Action bundle, attested and
# committed on `release/<tag>`, with `releases/v<major>` and the major tag moved to it, so no
# source commit carries it.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One group for every tag, so two releases never move the major branch and tag at once. GitHub
# keeps one run waiting and a third tag pushed meanwhile cancels the waiting one, never a running
# one: push one tag at a time, and re-run a release that was cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job that writes: the image push, the OIDC token and the attestation it signs.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    name: build and publish the action
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The one job that writes: the branch and tag moves, the OIDC token and the attestation it signs.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hiero-hackers/automation-runtime build:action
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/runtime/dist/action.js
      # The bundle goes through the contents API, which GitHub signs, onto `release/<tag>`, cut at
      # the tagged commit and kept, so each release SHA a consumer pins stays on a branch after the
      # major moves on. A re-run resets that branch and publishes a fresh SHA, which the notes below
      # then name. The release branch and the major tag move only once it has landed, so a failed
      # publish strips nothing. The body travels as a file: a bundle is larger than one argument may
      # be. No `git push`, and no credential is ever written to the checkout.
      - name: publish the bundle and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: packages/runtime/dist/action.js
        run: |
          set -euo pipefail
          REPO="repos/${GITHUB_REPOSITORY}"
          MAJOR="${GITHUB_REF_NAME%%.*}"
          TAG_BRANCH="release/${GITHUB_REF_NAME}"
          export FILE TAG_BRANCH
          export MSG="$(printf 'release: %s\n\nSigned-off-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>' "${GITHUB_REF_NAME}")"
          gh api -X PATCH "${REPO}/git/refs/heads/${TAG_BRANCH}" -f sha="${GITHUB_SHA}" -F force=true >/dev/null \
            || gh api -X POST "${REPO}/git/refs" -f ref="refs/heads/${TAG_BRANCH}" -f sha="${GITHUB_SHA}" >/dev/null
          node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.RUNNER_TEMP+"/put.json",JSON.stringify({message:process.env.MSG,branch:process.env.TAG_BRANCH,content:fs.readFileSync(process.env.FILE).toString("base64")}))'
          HEAD=$(gh api -X PUT "${REPO}/contents/${FILE}" --input "${RUNNER_TEMP}/put.json" --jq .commit.sha)
          gh api -X PATCH "${REPO}/git/refs/heads/releases/${MAJOR}" -f sha="${HEAD}" -F force=true >/dev/null \
            || gh api -X POST "${REPO}/git/refs" -f ref="refs/heads/releases/${MAJOR}" -f sha="${HEAD}" >/dev/null
          gh api -X PATCH "${REPO}/git/refs/tags/${MAJOR}" -f sha="${HEAD}" -F force=true >/dev/null \
            || gh api -X POST "${REPO}/git/refs" -f ref="refs/tags/${MAJOR}" -f sha="${HEAD}" >/dev/null
          echo "RELEASE_SHA=${HEAD}" >> "${GITHUB_ENV}"
      # The Release page is where a consumer finds the SHA to pin or roll back to: the one the
      # publish step landed, not the branch head, which another tag's run may have moved since.
      # Re-running a tag edits the notes instead of failing.
      - name: create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FILE: packages/runtime/dist/action.js
        run: |
          set -euo pipefail
          MAJOR="${GITHUB_REF_NAME%%.*}"
          NOTES="$(printf 'Bundle built from commit %s.\nPin `%s`, or the release SHA %s on `release/%s`.\nThe Action is pre-1.0: expect it to change, and start in `dry-run`.' "${GITHUB_SHA}" "${MAJOR}" "${RELEASE_SHA}" "${GITHUB_REF_NAME}")"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "${NOTES}" --prerelease="$([ "${MAJOR}" = v0 ] && echo true || echo false)"
            gh release upload "${GITHUB_REF_NAME}" "${FILE}" --clobber
          else
            PRE=()
            [ "${MAJOR}" = v0 ] && PRE=(--prerelease)
            gh release create "${GITHUB_REF_NAME}" "${FILE}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" --notes "${NOTES}" "${PRE[@]}"
          fi
